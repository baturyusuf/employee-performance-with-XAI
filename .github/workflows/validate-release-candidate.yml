name: Validate local release candidate

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact immutable manuscript evidence run ID
        required: true
        type: string
      expected_commit:
        description: Full 40-character Git commit bound to the candidate
        required: true
        type: string
      confirmation:
        description: This workflow validates only and never publishes
        required: true
        type: choice
        options:
          - VALIDATE_ONLY

permissions:
  contents: read

concurrency:
  group: release-candidate-validation
  cancel-in-progress: false

jobs:
  validate-only:
    runs-on: [self-hosted, Windows, X64, publication-release]
    timeout-minutes: 180
    env:
      ANTHROPIC_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      COHERE_API_KEY: ""
      GOOGLE_API_KEY: ""
      MISTRAL_API_KEY: ""
      OPENAI_API_KEY: ""
      PYTHONHASHSEED: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the candidate commit without deleting local scientific inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          clean: false
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-supplementary.txt
            requirements-legacy-optional.txt
            requirements-core.txt
            constraints/py314-lock.txt

      - name: Verify exact commit and validation-only confirmation
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:EXPECTED_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'expected_commit must be a full lowercase SHA-1' }
          if ($env:CONFIRMATION -ne 'VALIDATE_ONLY') { throw 'validation-only confirmation missing' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_COMMIT) { throw 'checked-out commit differs from expected_commit' }

      - name: Require every local real-data integration input
        run: |
          $required = @(
            'data/raw/inx_employee_performance.csv',
            'data/raw/INX_Future_Inc_Employee_Performance_CDS_Project2_Data_V1.8.xls',
            'data/external/hrdataset_v14/raw.csv',
            'data/external/ibm_hr_analytics/raw.csv',
            'data/external/employee_turnover/raw.csv'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -ne 0) { throw "Missing required local integration inputs: $($missing -join ', ')" }

      - name: Install exact development environment
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate dependency contract and environment
        run: |
          python -m src.governance.dependency_contract --profile development --validate-only
          python -m pip check

      - name: Run focused release and offline tests
        run: >-
          python -m pytest -q
          tests/test_core_build_makes_no_network_or_api_calls.py
          tests/test_ci_workflow_contract.py
          tests/test_latest_pointer_contract.py

      - name: Run complete test and compile gates
        run: |
          python -m pytest -q
          python -m unittest discover -s tests -p "test_*.py"
          python -m compileall -q src

      - name: Validate both immutable scopes without promotion or publication
        env:
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: python -m src.governance.ci_repository_gate --release-run-id $env:RELEASE_RUN_ID
