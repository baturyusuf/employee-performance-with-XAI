{
  "manuscript_final": {
    "schema_version": 1,
    "package": {
      "name": "employee_performance_manuscript_evidence",
      "run_id_prefix": "manuscript_final",
      "research_use": "research_grade_decision_support_only",
      "autonomous_hr_decisions_allowed": false,
      "claim_boundaries": {
        "shap": "Model attribution, not causality.",
        "counterfactuals": "Model scenarios, not employee prescriptions.",
        "fairness": "Removing sensitive or group variables does not establish fairness.",
        "related_tasks": "Attrition and turnover tasks are related-task robustness evidence, not employee-performance external validation."
      }
    },
    "datasets": {
      "inx_primary": {
        "path": "data/raw/inx_employee_performance.csv",
        "role": "primary_development_and_internal_oof_evaluation",
        "task_type": "ordinal_multiclass_performance",
        "target": "PerformanceRating",
        "allowed_claim": "Internal out-of-fold employee-performance evidence; not independent external validation."
      },
      "hrdataset_v14": {
        "path": "data/external/hrdataset_v14/raw.csv",
        "role": "independent_external_performance_target_replication",
        "task_type": "ordinal_multiclass_performance",
        "target": "PerformanceScore",
        "allowed_claim": "Independent external performance-target replication; not locked-model transport unless a separate transported-model result is generated."
      },
      "ibm_hr_analytics": {
        "path": "data/external/ibm_hr_analytics/raw.csv",
        "role": "restricted_target_performance_robustness",
        "task_type": "restricted_target_performance_robustness",
        "target": "PerformanceRating",
        "allowed_claim": "Restricted-target performance robustness only; not direct three-class external validation."
      },
      "ibm_hr_analytics_attrition": {
        "path": "data/external/ibm_hr_analytics/raw.csv",
        "role": "related_task_transfer",
        "task_type": "binary_attrition_transfer",
        "target": "Attrition",
        "allowed_claim": "Related attrition-task transfer evidence only; not employee-performance validation."
      },
      "employee_turnover": {
        "path": "data/external/employee_turnover/raw.csv",
        "role": "related_task_transfer",
        "task_type": "binary_turnover_transfer",
        "target": "left",
        "allowed_claim": "Related turnover-task transfer evidence only; not employee-performance validation."
      }
    },
    "target": {
      "primary_dataset": "inx_primary",
      "column": "PerformanceRating",
      "labels": [2, 3, 4],
      "ordering": [2, 3, 4],
      "problem_type": "ordinal_multiclass_performance"
    },
    "model": {
      "primary_model": "xgboost",
      "preprocessing": {
        "numeric": "passthrough",
        "categorical": "one_hot_encoder_handle_unknown_ignore",
        "fit_scope": "training_partition_only"
      },
      "xgboost": {
        "n_estimators": 300,
        "max_depth": 4,
        "learning_rate": 0.05,
        "subsample": 0.9,
        "colsample_bytree": 0.9,
        "objective": "multi:softprob",
        "eval_metric": "mlogloss",
        "n_jobs": -1,
        "random_state_seed": "model"
      }
    },
    "feature_policies": {
      "primary_policy": "no_salary_hike_no_attrition_no_department",
      "definitions": {
        "full_feature_upper_bound": {
          "excluded_features": ["EmpNumber", "PerformanceRating"],
          "role": "diagnostic_upper_bound_never_deployable",
          "audit_only": true
        },
        "no_salary_hike": {
          "excluded_features": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent"],
          "role": "leakage_ablation_non_primary",
          "audit_only": true
        },
        "no_salary_hike_no_attrition": {
          "excluded_features": ["Age", "Gender", "MaritalStatus", "EmpLastSalaryHikePercent", "Attrition", "EmpNumber", "PerformanceRating"],
          "role": "governed_leakage_ablation_non_primary",
          "audit_only": false
        },
        "no_salary_hike_no_attrition_no_department": {
          "excluded_features": ["Age", "Gender", "MaritalStatus", "EmpDepartment", "EmpLastSalaryHikePercent", "Attrition", "EmpNumber", "PerformanceRating"],
          "role": "canonical_primary",
          "audit_only": false
        },
        "no_salary_hike_no_attrition_no_department_no_job_role": {
          "excluded_features": ["Age", "Gender", "MaritalStatus", "EmpDepartment", "EmpJobRole", "EmpLastSalaryHikePercent", "Attrition", "EmpNumber", "PerformanceRating"],
          "role": "strict_proxy_sensitivity_non_primary",
          "audit_only": false
        },
        "no_salary_hike_no_attrition_sensitive_retaining_audit": {
          "excluded_features": ["EmpLastSalaryHikePercent", "Attrition", "EmpNumber", "PerformanceRating"],
          "role": "sensitive_retaining_leakage_ablation_non_primary",
          "audit_only": true
        }
      }
    },
    "governance_fields": {
      "fairness_sensitive_fields": ["Age", "Gender", "MaritalStatus"],
      "fairness_audit_fields": ["Age", "Gender", "MaritalStatus", "EmpDepartment", "EducationBackground", "BusinessTravelFrequency"],
      "audit_only_fields": ["Age", "Gender", "MaritalStatus", "EmpDepartment"],
      "identifier_fields": ["EmpNumber"],
      "outcome_or_post_outcome_fields": ["PerformanceRating", "EmpLastSalaryHikePercent", "Attrition"]
    },
    "fairness": {
      "scope": "support_aware_primary_task_oof_audit",
      "policy_comparisons_source": "proxy_analysis.common_fold_policy_comparisons",
      "protected_or_sensitive_source": "governance_fields.fairness_sensitive_fields",
      "exploratory_operational_source": "governance_fields.fairness_audit_fields_minus_sensitive",
      "minimum_group_support": 30,
      "minimum_class_metric_denominator": 10,
      "attribute_transforms": {
        "Age": {
          "type": "numeric_bins",
          "edges": [17, 29, 39, 49, 59, 200],
          "labels": ["18-29", "30-39", "40-49", "50-59", "60+"]
        }
      },
      "metrics_by_task": {
        "ordinal_multiclass_performance": {
          "overall": ["accuracy", "macro_f1"],
          "class_specific": ["positive_prediction_rate", "true_positive_rate", "false_positive_rate", "precision", "mean_predicted_probability"]
        }
      },
      "bootstrap_source": "evaluation.bootstrap",
      "bootstrap_stratify_by": ["fold", "y_true"],
      "bootstrap_batch_size": 200,
      "stability": {
        "minimum_valid_bootstrap_fraction": 0.8,
        "wide_interval_threshold": 0.25
      },
      "claim_boundary": "Subgroup gaps are descriptive OOF audit evidence with support and uncertainty constraints; they do not establish discrimination, fairness, or causality."
    },
    "proxy_analysis": {
      "target": "EmpDepartment",
      "watchlist": ["EmpJobRole", "EducationBackground", "BusinessTravelFrequency"],
      "interpretation": "Reconstructability is proxy-risk evidence, not proof of causal or discriminatory use by the performance model.",
      "classifier": "class_weight_balanced_logistic_regression",
      "target_removed_from_all_proxy_predictors": true,
      "metrics": ["accuracy", "balanced_accuracy", "macro_f1"],
      "common_fold_policy_comparisons": [
        "no_salary_hike_no_attrition",
        "no_salary_hike_no_attrition_no_department",
        "no_salary_hike_no_attrition_no_department_no_job_role"
      ]
    },
    "evaluation": {
      "cv": {
        "strategy": "StratifiedKFold",
        "n_splits": 10,
        "shuffle": true,
        "seed": "cv",
        "shared_fold_assignment_across_policies": true
      },
      "bootstrap": {
        "n_resamples": 5000,
        "confidence_level": 0.95,
        "seed": "bootstrap"
      },
      "statistical_tests": {
        "paired_test": "wilcoxon_signed_rank",
        "multiple_comparison_correction": "holm",
        "alpha": 0.05
      },
      "metric_applicability": {
        "ordinal_multiclass_performance": {
          "applicable": ["accuracy", "balanced_accuracy", "macro_f1", "quadratic_weighted_kappa", "ordinal_mae", "severe_error_rate", "log_loss", "multiclass_brier", "ece"],
          "not_applicable": [],
          "cross_task_comparability": "Comparable only with datasets having a verified three-class 2/3/4 performance mapping."
        },
        "restricted_target_performance_robustness": {
          "applicable": ["accuracy", "balanced_accuracy", "macro_f1", "log_loss", "ece"],
          "not_applicable": ["quadratic_weighted_kappa", "ordinal_mae", "severe_error_rate", "multiclass_brier"],
          "cross_task_comparability": "Robustness-only; do not present as equivalent to the primary three-class task."
        },
        "binary_attrition_transfer": {
          "applicable": ["accuracy", "balanced_accuracy", "macro_f1", "roc_auc", "average_precision", "log_loss", "binary_brier", "ece"],
          "not_applicable": ["quadratic_weighted_kappa", "ordinal_mae", "severe_error_rate", "multiclass_brier"],
          "cross_task_comparability": "Related-task evidence only; ordinal metrics are N/A and must not be encoded as zero."
        },
        "binary_turnover_transfer": {
          "applicable": ["accuracy", "balanced_accuracy", "macro_f1", "roc_auc", "average_precision", "log_loss", "binary_brier", "ece"],
          "not_applicable": ["quadratic_weighted_kappa", "ordinal_mae", "severe_error_rate", "multiclass_brier"],
          "cross_task_comparability": "Related-task evidence only; ordinal metrics are N/A and must not be encoded as zero."
        }
      }
    },
    "calibration": {
      "scope": "canonical_primary_policy",
      "outer_cv": "evaluation.cv",
      "calibration_split_scope": "inside_each_outer_training_fold",
      "methods": ["raw", "sigmoid", "isotonic"],
      "evaluation_scope": "outer_test_fold_only",
      "n_bins": 10,
      "selection_metrics": ["log_loss", "multiclass_brier", "ece"],
      "probability_warning": "Calibrated probabilities are uncertain research outputs and must not be used as autonomous HR decision thresholds."
    },
    "shap": {
      "scope": "canonical_primary_policy_same_oof_model_and_preprocessing_contract",
      "group_one_hot_to_raw_feature_families": true,
      "global": {
        "statistic": "mean_absolute_shap",
        "class_specific": true
      },
      "local": {
        "representative_case_strata": ["correct", "incorrect", "low_confidence", "high_confidence", "minority_class"],
        "top_k_reason_codes": 10
      },
      "stability": {
        "fold_rankings": true,
        "top_k": 10,
        "pairwise_metrics": ["jaccard", "spearman"]
      },
      "governance_metadata_required": true,
      "forbidden_features_source": "feature_policies.primary_policy.excluded_features",
      "warnings": [
        "SHAP values are model attributions, not causal effects.",
        "Remaining features may encode sensitive or organisational proxy information."
      ]
    },
    "counterfactuals": {
      "model_evaluation_scope": "out_of_fold_only",
      "prototype_scope": "outer_training_partition_only",
      "evaluation_population": "all_eligible_oof_cases",
      "sample_size": null,
      "material_compute_tradeoff_requires_user_decision": true,
      "eligibility": "predicted_class_below_highest_target_class",
      "stratify_descriptively_by": ["predicted_class", "true_class", "correctness", "confidence"],
      "max_features_changed": 3,
      "top_k_per_case": 5,
      "domain_source": "training_partition_and_feature_taxonomy",
      "immutable_and_history_constraints_required": true,
      "cost_scaling": "training_partition_robust_range_for_numeric_and_unit_cost_for_categorical",
      "intervention_modes": {
        "employee_only": ["employee_controllable"],
        "employee_manager": ["employee_controllable", "manager_controllable"],
        "organization_allowed": ["employee_controllable", "manager_controllable", "organisation_controllable"],
        "diagnostic_full_default": ["employee_controllable", "manager_controllable", "organisation_controllable"],
        "no_salary": ["employee_controllable", "manager_controllable", "organisation_controllable"]
      },
      "no_salary_excluded_features": ["EmpLastSalaryHikePercent"],
      "uncertainty": {
        "methods": ["wilson_binomial", "bootstrap"],
        "confidence_level": 0.95,
        "seed": "counterfactual"
      },
      "warning": "Counterfactuals are model scenarios, not causal findings or employee prescriptions."
    },
    "llm_agent_evaluation": {
      "scope": {
        "inx_primary": 40,
        "hrdataset_v14": 40
      },
      "selection": "predeclared_stratified_risk_aware",
      "complete_case_evidence_required": true,
      "missing_evidence_stratum_must_be_separate": true,
      "real_run_preflight_blocks_incomplete_evidence": true,
      "paid_api_execution_requires_explicit_user_approval": true,
      "default_execution_mode": "deterministic_preflight_only",
      "report_wilson_intervals": true,
      "deterministic_agent_roles": {
        "LeakageAuditAgent": {
          "evidence_scope": "feature-policy and leakage-sensitivity evidence",
          "authority": "audit_and_warning_only"
        },
        "CalibrationAuditAgent": {
          "evidence_scope": "nested calibration reliability and probability-use warnings",
          "authority": "audit_and_warning_only"
        },
        "ShapStabilityAuditAgent": {
          "evidence_scope": "global/local attribution stability and non-causality warnings",
          "authority": "audit_and_warning_only"
        },
        "FairnessProxyAuditAgent": {
          "evidence_scope": "support-aware subgroup disparity and proxy-risk evidence",
          "authority": "audit_and_warning_only"
        },
        "CounterfactualActionabilityAgent": {
          "evidence_scope": "out-of-fold scenario validity, feasibility, and actionability constraints",
          "authority": "audit_and_warning_only"
        },
        "ExplanationComplianceAgent": {
          "evidence_scope": "claim-boundary and required-warning compliance",
          "authority": "audit_and_warning_only"
        },
        "SupervisorGovernanceAgent": {
          "evidence_scope": "deterministic synthesis of specialist findings and blockers",
          "authority": "research_readiness_synthesis_only"
        }
      },
      "claim_boundary": "The LLM interprets governed evidence and is not the predictive model or an autonomous HR decision maker."
    },
    "chatbot_guardrails": {
      "engine": "deterministic_report_backed_chatbot",
      "minimum_unsafe_prompts": 50,
      "minimum_safe_prompts": 25,
      "required_categories": [
        "paraphrased_hr_decisions",
        "indirect_ranking",
        "multilingual_turkish",
        "obfuscated_sensitive_attributes",
        "prompt_injection",
        "hide_uncertainty_or_warnings",
        "direct_advice_from_shap_or_counterfactuals",
        "retrieval_failure",
        "conflicting_evidence"
      ],
      "versioned_prompt_suite_required": true,
      "report_category_results": true,
      "report_wilson_intervals": true,
      "real_llm_execution_requires_explicit_user_approval": true,
      "claim_boundary": "The deterministic suite is scoped evidence, not comprehensive safety proof."
    },
    "output": {
      "root": "reports/manuscript_final",
      "run_directory_template": "{root}/{run_id}",
      "latest_pointer": "reports/manuscript_final/latest",
      "manifest_filename": "run_manifest.json",
      "compatible_cache_requires": ["run_id", "config_hash", "dataset_hashes", "git_commit", "source_tree_hash"]
    },
    "seeds": {
      "master": 42,
      "cv": 42,
      "model": 42,
      "bootstrap": 42,
      "calibration": 42,
      "shap": 42,
      "counterfactual": 42,
      "fairness": 42,
      "llm_sampling": 42,
      "chatbot": 42
    },
    "figures": {
      "publication_dpi": 300,
      "raster_format": "png",
      "vector_format": "svg",
      "font_family": "DejaVu Sans",
      "metadata_fields": ["run_id", "config_hash"],
      "definitions": {
        "figure_1": "overall_hr_xai_governance_architecture",
        "figure_2": "structured_shap_to_llm_evidence_flow",
        "figure_3": "multi_agent_governance_audit_structure",
        "figure_4": "gxair_component_readiness_dashboard",
        "figure_5": "calibration_and_ordinal_error_summary",
        "figure_6": "global_grouped_shap_attribution",
        "figure_7": "local_grouped_shap_reason_code_case"
      }
    },
    "provenance": {
      "data_acquisition_manifest": "configs/data_acquisition.yaml",
      "dataset_cards_config": "configs/dataset_provenance.yaml",
      "dataset_cards_config_hash_required": true,
      "dataset_card_required_fields_must_be_nonblank": true,
      "ambiguous_source_or_licence_status": "manual_review_required",
      "hash_algorithm": "sha256",
      "git_commit_required": true,
      "record_dirty_worktree": true,
      "source_tree_hash_required": true,
      "config_hash_method": "canonical_json_sha256",
      "dataset_hashes_required": true,
      "artifact_hashes_required": true,
      "artifact_identity_fields": ["run_id", "config_hash"],
      "manifest_missing_file_policy": "fail",
      "package_names": [
        "python",
        "numpy",
        "pandas",
        "scipy",
        "scikit-learn",
        "xgboost",
        "shap",
        "matplotlib",
        "PyYAML",
        "lightgbm",
        "catboost",
        "openai",
        "openai-agents",
        "python-dotenv",
        "xlrd",
        "openpyxl",
        "pytest"
      ]
    }
  }
}
