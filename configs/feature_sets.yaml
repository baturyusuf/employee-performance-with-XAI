{
  "policy_source": {
    "status": "legacy_compatibility_projection",
    "canonical_source": "configs/manuscript_final.yaml",
    "same_named_policy_exclusions_must_match": true
  },
  "feature_sets": {
    "full_feature_upper_bound": {
      "description": "All non-ID predictors except target. Diagnostic information-rich leakage-risk comparator only; not a guaranteed optimized upper bound or deployable policy.",
