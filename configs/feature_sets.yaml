      "deployment_status": "upper_bound_leakage_warning"
    },
    "no_salary_hike": {
      "description": "Removes primary outcome-proximal compensation variable.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent"],
      "deployment_status": "sensitivity_only"
    },
    "no_salary_hike_no_attrition": {
      "description": "Governed leakage-aware comparison excluding outcome-proximal fields and direct sensitive demographic fields.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent", "Attrition", "Age", "Gender", "MaritalStatus"],
      "deployment_status": "candidate"
    },
    "no_salary_hike_no_attrition_no_department": {
      "description": "Canonical leakage-aware XGBoost policy excluding outcome-proximal, direct sensitive demographic, identifier, target, and department fields.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent", "Attrition", "EmpDepartment", "Age", "Gender", "MaritalStatus"],
      "deployment_status": "candidate"
    },
    "no_salary_hike_no_attrition_with_age_audit": {
      "description": "Legacy audit-only leakage-aware feature set retaining all sensitive demographics; retained under a distinct historical name.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent", "Attrition"],
      "deployment_status": "audit_only"
    },
    "no_salary_hike_no_attrition_no_department_with_age_audit": {
      "description": "Legacy audit-only department-free leakage-aware feature set retaining all sensitive demographics; retained under a distinct historical name.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent", "Attrition", "EmpDepartment"],
      "deployment_status": "audit_only"
    },
    "no_salary_hike_no_attrition_no_department_no_job_role": {
      "description": "Stricter leakage-aware proxy sensitivity policy additionally excluding job role.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent", "Attrition", "Age", "Gender", "MaritalStatus", "EmpDepartment", "EmpJobRole"],
      "deployment_status": "sensitivity_only"
    },
    "no_salary_hike_no_attrition_sensitive_retaining_audit": {
      "description": "Audit-only leakage-aware policy retaining sensitive demographic fields to isolate the governance exclusion contrast.",
      "drop": ["EmpNumber", "PerformanceRating", "EmpLastSalaryHikePercent", "Attrition"],
      "deployment_status": "audit_only"
    },
    "no_sensitive_demographic": {
      "description": "Sensitivity set excluding direct demographic attributes, including researcher-approved Age exclusion.",
      "drop": ["EmpNumber", "PerformanceRating", "Gender", "MaritalStatus", "Age"],
      "deployment_status": "sensitivity_only"
    },
    "actionable_employee_only": {
      "description": "Only employee-controllable variables after taxonomy review.",
      "include_by_control_type": ["employee_controllable"],
      "deployment_status": "counterfactual_only"
    },
    "employee_manager": {
      "description": "Variables controllable by employee or manager.",
      "include_by_control_type": ["employee_controllable", "manager_controllable"],
      "deployment_status": "counterfactual_only"
    }
  }
